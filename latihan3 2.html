<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form biodata siswa</title>
    <link rel="stylesheet" href="latihan3 2.css">
</head>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const panels = document.querySelectorAll(".panel-biodata");

    if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver(
            function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("muncul");
                    } else {
                        entry.target.classList.remove("muncul");
                    }
                });
            },
            {
                threshold: 0.15
            }
        );

        panels.forEach(function (panel) {
            observer.observe(panel);
        });
    } else {
        panels.forEach(function (panel) {
            panel.classList.add("muncul");
        });
    }
});
</script>

<body>
    <h1>form biodata siswa</h1>
       
<form>
    <!-- PANEL 1: IDENTITAS -->
    <section class="panel-biodata">
        <h2>01 // Identitas Siswa</h2>

        <label for="nim">NIM:</label>
        <input type="text" id="nim" name="nim"
               placeholder="Masukkan NIM">

        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" name="nama"
               placeholder="Masukkan nama lengkap">

        <label for="kelas">Kelas:</label>
        <select id="kelas" name="kelas">
            <option value="">-- Pilih kelas --</option>
            <option value="X">X</option>
            <option value="XI">XI</option>
            <option value="XII">XII</option>
        </select>
    </section>

    <!-- PANEL 2: JURUSAN -->
    <section class="panel-biodata">
        <h2>02 // Pilihan Jurusan</h2>
        <p class="petunjuk">Pilih jurusan kamu</p>

        <div class="pilihan">
            <label><input type="checkbox" name="jurusan" value="AKL"> AKL</label>
            <label><input type="checkbox" name="jurusan" value="MPLB"> MPLB</label>
            <label><input type="checkbox" name="jurusan" value="TJKT"> TJKT</label>
            <label><input type="checkbox" name="jurusan" value="TKR"> TKR</label>
        </div>
    </section>

    <!-- PANEL 3: DATA PRIBADI -->
    <section class="panel-biodata">
        <h2>03 // Data Pribadi</h2>

        <label for="tempat">Tempat Lahir:</label>
        <input type="text" id="tempat" name="tempat"
               placeholder="Masukkan tempat lahir">

        <label for="tanggal">Tanggal Lahir:</label>
        <input type="date" id="tanggal" name="tanggal">

        <p class="petunjuk">Jenis Kelamin</p>

        <div class="pilihan">
            <label>
                <input type="radio" name="gender" value="Laki-laki">
                Laki-laki
            </label>

            <label>
                <input type="radio" name="gender" value="Perempuan">
                Perempuan
            </label>
        </div>
    </section>

    <!-- PANEL 4: KONTAK -->
    <section class="panel-biodata">
        <h2>04 // Informasi Kontak</h2>

        <label for="alamat">Alamat:</label>
        <textarea id="alamat" name="alamat"
                  placeholder="Masukkan alamat lengkap"
                  rows="4"></textarea>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"
               placeholder="Masukkan email aktif">
    </section>

    <!-- PANEL 5: KONFIRMASI -->
    <section class="panel-biodata panel-kirim">
        <h2>05 // Finalisasi Data</h2>
        <p>Pastikan semua biodata sudah benar sebelum dikirim.</p>
        <button type="submit">Kirim Biodata ✦</button>
    </section>
</form>
    
</body>
</html>
